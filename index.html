<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <title>Les Ailes de l’Espoir</title>
    <meta name="description" content="Association Les Ailes de l’Espoir : Espoir · Courage · Solidarité.">
    <style>
        :root{
            --bg:#050b1f;
            --bg2:#0b1736;
            --card:rgba(255,255,255,.05);
            --gold:#f2b632;
            --gold2:#ffd36b;
            --blue:#2f6bff;
            --tx:#fff;
            --mut:#c4cce0;
            --bd:rgba(255,255,255,.22)
        }
        *{
            box-sizing:border-box;
            margin:0;
            padding:0
        }
        html{
            scroll-behavior:smooth
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background:url(images/fond.jpg) center/contain no-repeat;
            opacity:.07;
            z-index:-1;
            pointer-events:none
        }
        body{
            font-family:Inter,"Segoe UI",system-ui,sans-serif;
            background:var(--bg);
            color:var(--tx);
            line-height:1.6
        }
        img{
            max-width:100%;
            display:block
        } 
        a{
            color:inherit;
            text-decoration:none
        }
        .wrap{
            max-width:1180px;
            margin:auto;
            padding:0 20px
        }
        header{
            position:fixed;
            inset:0 0 auto;
            z-index:50;
            background:rgba(5,11,31,.82);
            backdrop-filter:blur(10px)
        }
        .nav{
            display:flex;
            align-items:center;
            justify-content:space-between;
            height:70px;
            gap:16px
        }
        .logo{
            display:flex;
            align-items:center;
            gap:10px;
            font-weight:800;
            line-height:1.1
        }
        .logo span{
            display:block;
            font-size:.62rem;
            letter-spacing:.2em;
            color:var(--gold);
            font-weight:600
        }
        .logo img{
            height:48px;
            width:auto;
            filter:drop-shadow(0 0 8px rgba(242,182,50,.35))
        }
        nav ul{
            display:flex;
            gap:26px;
            list-style:none;
            font-size:.78rem;
            font-weight:700;
            letter-spacing:.06em;
            text-transform:uppercase
        }
        nav a{
            padding:6px 0;
            border-bottom:2px solid transparent
        }
        nav a:hover,nav a.on{
            color:var(--gold);
            border-color:var(--gold)
        }
        .right{
            display:flex;
            align-items:center;
            gap:10px
        }
        .btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:13px 24px;
            border-radius:7px;
            font-weight:800;
            font-size:.85rem;
            letter-spacing:.04em;
            text-transform:uppercase;
            cursor:pointer;
            border:1px solid transparent;
            transition:.2s
        }
        .gold{
            background:linear-gradient(135deg,var(--gold),#d89a14);
            color:#11182e}.gold:hover{transform:translateY(-2px);
            box-shadow:0 8px 24px rgba(242,182,50,.35)
        }
        .line{
            border-color:var(--bd);
            color:#fff;
            background:rgba(0,0,0,.25)
        }
        .line:hover{
            border-color:var(--gold);
            color:var(--gold)
        }
        .sm{
            padding:9px 16px;
            font-size:.75rem
        }
        .lang{
            background:none;
            border:1px solid var(--bd);
            color:#fff;
            border-radius:6px;
            padding:8px 11px;
            font-weight:700;
            cursor:pointer
        }
        .burger{
            display:none;
            background:none;
            border:0;
            color:#fff;
            font-size:1.8rem;
            cursor:pointer
        }
        .hero{
            position:relative;
            min-height:100vh;
            display:flex;
            align-items:center;
            padding:110px 0 50px;
            background:linear-gradient(90deg,rgba(5,11,31,.96) 0%,rgba(5,11,31,.78) 45%,rgba(5,11,31,.15) 100%),url(images/hero.jpg) 65% center/cover
        }
        .hero:after{
            content:"";
            position:absolute;
            inset:auto 0 0;
            height:120px;
            background:linear-gradient(transparent,var(--bg))
        }
        .hero .wrap{
            position:relative;
            z-index:2
        }
        .kick{
            display:flex;
            align-items:center;
            gap:12px;
            font-size:.85rem;
            font-weight:700;
            letter-spacing:.14em;
            text-transform:uppercase;
            margin-bottom:18px
        }
        .kick:before{
            content:"";
            width:50px;
            height:1px;
            background:#fff
        }
        h1{
            font-size:clamp(2.5rem,6.4vw,5rem);
            line-height:1.02;
            font-weight:900;
            text-transform:uppercase;
            max-width:640px
        }
        h1 em{
            display:block;
            font-style:normal;
            color:var(--gold)
        }
        .lead{
            max-width:520px;
            margin:22px 0 28px;
            color:#e5eaf7
        }
        .lead b{
            color:var(--gold2)
        }
        .cta{
            display:flex;
            flex-wrap:wrap;
            gap:14px;
            margin-bottom:22px
        }
        .trust{
            font-size:.78rem;
            font-weight:700;
            color:var(--mut);
            margin-bottom:26px
        }
        .stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            border:1px solid var(--bd);
            border-radius:14px;
            background:rgba(5,11,31,.72);
            backdrop-filter:blur(8px);
            max-width:760px
        }
        .st{
            display:flex;
            align-items:center;
            gap:12px;
            padding:16px 18px;
            border-left:1px solid var(--bd)
        }
        .st:first-child{
            border:0
        }
        .ic{
            flex:none;
            width:46px;
            height:46px;
            border-radius:50%;
            background:linear-gradient(135deg,var(--gold),#c98a10);
            display:grid;
            place-items:center;
            font-size:1.3rem
        }
        .st b{
            display:block;
            font-size:1.3rem;
            line-height:1.1
        }
        .st small{
            font-size:.72rem;
            color:var(--mut);
            line-height:1.2;
            display:block
        }
        .badge{
            position:absolute;
            right:4%;
            bottom:130px;
            z-index:3;
            background:#fff;
            color:#11182e;
            border-radius:40px 8px 40px 8px;
            padding:14px 20px;
            font-size:.85rem;
            font-weight:700;
            display:flex;gap:10px;
            align-items:center;
            box-shadow:0 12px 30px rgba(0,0,0,.4)
        }
        section{
            padding:90px 0
        }
        .alt{
            background:rgba(11,23,54,.85)
        }
        .tag{
            color:var(--gold);
            font-size:.8rem;
            font-weight:800;
            letter-spacing:.18em;
            text-transform:uppercase
        }
        h2{
            font-size:clamp(1.8rem,4vw,2.7rem);
            line-height:1.15;
            margin:8px 0 14px;
            font-weight:900
        }
        .sub{
            color:var(--mut);
            max-width:640px
        }
        .head{
            margin-bottom:44px
        }
        .grid{
            display:grid;
            gap:22px
        }
        .g2{
            grid-template-columns:1fr 1fr;
            gap:34px;
            align-items:center
        }
        .g3{
            grid-template-columns:repeat(3,1fr)
        }
        .g4{
            grid-template-columns:repeat(4,1fr)
        }
        .g5{
            grid-template-columns:repeat(5,1fr)
        }
        .card{
            background:var(--card);
            border:1px solid var(--bd);
            border-radius:16px;
            padding:28px;
            transition:.25s
        }
        .card:hover{
            transform:translateY(-5px);
            border-color:var(--gold)
        }
        .card .ic{
            margin-bottom:16px
        }
        .card h3{
            margin-bottom:8px;
            font-size:1.12rem
        }
        .card p{
            color:var(--mut);
            font-size:.93rem
        }
        .alogo{
            text-align:center;
            padding:34px 24px;
            background:radial-gradient(circle at 50% 40%,rgba(47,107,255,.28),transparent 70%),var(--card)
        }
        .alogo img{
            max-width:380px;
            width:100%;
            margin:auto;
            filter:drop-shadow(0 0 28px rgba(242,182,50,.3))
        }
        .alogo p{
            color:var(--gold2);
            font-style:italic;
            margin-top:14px
        }
        .vc{
            text-align:center
        }
        .vc .ic{
            margin:0 auto 14px;
            width:62px;
            height:62px;
            font-size:1.6rem
        }
        .vc h3{
            color:var(--gold2);
            font-size:1.3rem
        }
        .call .card{
            text-align:left
        }
        .call .grid{
            margin-top:34px
        }
        .band{
            display:flex;
            flex-wrap:wrap;
            gap:24px;
            align-items:center;
            justify-content:space-between;
            background:linear-gradient(135deg,rgba(47,107,255,.22),rgba(242,182,50,.16));
            border:1px solid var(--bd);
            border-radius:16px;
            padding:28px;
            margin-bottom:46px
        }
        .band h3{
            color:#fff;
            font-size:1.3rem
        }
        .band p{
            max-width:460px
        }
        .band .news{
            margin:0;
            flex:1;
            min-width:280px
        }
        .flogo{
            width:190px;
            margin-bottom:12px;
            filter:drop-shadow(0 0 16px rgba(242,182,50,.25))
        }
        .soc{
            display:flex;
            gap:10px;
            margin-top:14px
        }
        .soc a{
            width:38px;
            height:38px;
            border-radius:50%;
            border:1px solid var(--bd);
            display:grid;
            place-items:center;
            font-weight:800;
            font-size:.8rem;
            color:#fff
        }
        .soc a:hover{
            background:var(--gold);
            color:#11182e;
            border-color:var(--gold)
        }
        .legal{
            display:flex;
            flex-wrap:wrap;
            gap:8px 22px;
            justify-content:space-between;
            align-items:center
        }
        .legal a:hover{
            color:var(--gold)
        }
        .vals{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:18px
        }
        .vals span{
            border:1px solid var(--gold);
            color:var(--gold2);
            border-radius:30px;
            padding:6px 16px;
            font-weight:700;
            font-size:.85rem
        }
        .num{
            text-align:center
        }
        .num .ic{
            margin:0 auto 12px;
            width:58px;
            height:58px
        }
        .num b{
            font-size:2.2rem;
            display:block;
            color:var(--gold2)
        }
        .num p{
            color:var(--mut);
            font-size:.88rem
        }
        .gal{
            grid-template-columns:repeat(3,1fr)
        }
        .gi{
            border:1px solid var(--bd);
            border-radius:16px;
            overflow:hidden;
            background:var(--card)
        }
        .ph{
            height:170px;
            background:linear-gradient(135deg,#17306f,#0b1736 55%,#7a5a14);
            display:grid;
            place-items:center;
            font-size:2.6rem
        }
        .gi div:last-child{
            padding:18px
        }
        .gi small{
            color:var(--gold);
            font-weight:700
        }
        .gi p{
            color:var(--mut);
            font-size:.9rem;
            margin-top:6px
        }
        .call{
            text-align:center;
            background:linear-gradient(135deg,rgba(47,107,255,.25),rgba(242,182,50,.2));
            border-top:1px solid var(--bd);
            border-bottom:1px solid var(--bd)
        }
        .call .cta{
            justify-content:center;
            margin:26px 0 0
        }
        .call .sub{
            margin:auto
        }
        .quote p{
            font-style:italic;
            color:#e5eaf7;
            margin-bottom:14px
        }
        .quote b{
            color:var(--gold)
        }
        .part{
            display:flex;
            flex-wrap:wrap;
            gap:34px;
            justify-content:center;
            margin-top:46px;
            color:var(--mut);
            font-weight:800;
            letter-spacing:.06em;
            opacity:.8
        }
        .news{
            display:flex;
            gap:10px;
            max-width:520px;
            margin-top:18px
        }
        input{
            flex:1;
            padding:13px 16px;
            border-radius:7px;
            border:1px solid var(--bd);
            background:rgba(255,255,255,.07);
            color:#fff;
            font:inherit;
            min-width:0
        }
        footer{
            background:#030715;
            padding:60px 0 24px;
            border-top:1px solid var(--bd);
            font-size:.9rem;
            color:var(--mut)
        }
        .fg{
            grid-template-columns:1.6fr 1fr 1fr 1.2fr;
            margin-bottom:34px
        }
        .fg h4{
            color:#fff;
            margin-bottom:12px
        }
        .fg li{
            list-style:none;
            margin-bottom:6px
        }
        .fg a:hover{
            color:var(--gold)
        }
        .copy{
            border-top:1px solid var(--bd);
            padding-top:18px;
            text-align:center;
            font-size:.8rem
        }
        @media(max-width:960px){
            .burger{
                display:block
            }
            nav{
                position:absolute;
                top:70px;
                left:0;
                right:0;
                background:var(--bg);
                display:none;
                padding:16px 20px;
                border-bottom:1px solid var(--bd)
            }
            nav.open{
                display:block
            }
            nav ul{
                flex-direction:column;
                gap:14px
            }
            .right .btn{
                display:none
            }
            .g2,.g3,.gal,.fg{
                grid-template-columns:1fr
            }
            .g4{
                grid-template-columns:1fr 1fr
            }
            .g5{
                grid-template-columns:repeat(2,1fr)
            }
            .stats{
                grid-template-columns:1fr 1fr
            }
            .st:nth-child(3){
                border-left:0
            }
            .st:nth-child(n+3){
                border-top:1px solid var(--bd)
            }
            .badge{
                display:none
            }
            .hero{
                background-position:70% center
            }
        }
        @media(max-width:480px){
            .st{
                padding:12px
            }
            .ic{
                width:38px;
                height:38px;
                font-size:1rem
            }
            .news{
                flex-direction:column
            }
            .g4{
                grid-template-columns:1fr
            }
            .btn{
                width:100%;
                justify-content:center
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap nav">
            <a href="#home" class="logo">
                <img src="images/logo-emblem.png" alt="Logo Les Ailes de l’Espoir">
                <div>
                    LES AILES DE L’ESPOIR<span data-i="motto"></span>
                </div>
            </a>
            <nav id="menu">
                <ul>
                    <li><a href="#home" class="on" data-i="n1"></a></li>
                    <li><a href="#about" data-i="n2"></a></li>
                    <li><a href="#domains" data-i="n3"></a></li>
                    <li><a href="#impact" data-i="n4"></a></li>
                    <li><a href="adhesion.html" data-i="n5"></a></li>
                    <li><a href="#contact" data-i="n6"></a></li>
                </ul>
            </nav>
            <div class="right">
                <button class="lang" id="lang" aria-label="Langue">EN</button>
                <a href="https://mboaticket.com/collecte/soutien-aux-orphelins-pour-noel-2026/" class="btn gold sm">♥ <span data-i="donate"></span></a>
                <button class="burger" id="bg" aria-label="Menu">☰</button>
            </div>
        </div>
    </header>

    <main id="home">
        <div class="hero">
            <div class="wrap">
                <div class="kick" data-i="kick"></div>
                <h1><span data-i="h1a"></span><em data-i="h1b"></em></h1>
                <p class="lead" data-i="lead"></p>
                <div class="cta">
                    <a href="adhesion.html" class="btn gold" data-i="n5"></a>
                    <a href="https://mboaticket.com/collecte/soutien-aux-orphelins-pour-noel-2026/" class="btn line">♥ <span data-i="donate"></span></a>
                </div>
                <p class="trust">✔ <span data-i="trust"></span></p>
                <div class="stats">
                    <div class="st">
                        <!-- <div class="ic">👧</div> -->
                        <div><b data-c="50">0</b><small data-i="s1"></small></div>
                    </div>
                    <div class="st">
                        <!-- <div class="ic">🏠</div> -->
                        <div><b data-c="2">0</b><small data-i="s2"></small></div>
                    </div>
                    <div class="st">
                        <!-- <div class="ic">🤝</div> -->
                        <div><b data-c="20">0</b><small data-i="s3"></small></div>
                    </div>
                    <div class="st">
                        <!-- <div class="ic">📋</div> -->
                        <div><b data-c="10">0</b><small data-i="s4"></small></div>
                    </div>
                </div>
            </div>
            <div class="badge">
                <img src="images/logo-emblem.png" alt="" style="height:34px;width:auto"> <span data-i="badge"></span>
            </div>
        </div>

        <section id="about">
            <div class="wrap grid g2">
                <div>
                    <span class="tag" data-i="t1"></span>
                    <h2 data-i="a1"></h2>
                    <p class="sub" data-i="a2"></p>
                    <div class="vals">
                        <span data-i="v1"></span>
                        <span data-i="v2"></span>                            
                        <span data-i="v3"></span>
                    </div>
                </div>
                <div class="grid">
                    <div class="card alogo">
                        <img src="images/logo-full.png" alt="Les Ailes de l’Espoir" loading="lazy">
                        <p data-i="fq"></p>
                    </div>
                    <div class="grid g2" style="gap:16px">
                        <div class="card">
                            <h3 data-i="w1"></h3>
                            <p data-i="w2"></p>
                        </div>
                        <div class="card">
                            <h3 data-i="vi1"></h3>
                            <p data-i="vi2"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="alt">
            <div class="wrap">
                <div class="head" style="text-align:center">
                    <span class="tag" data-i="tv"></span>
                    <h2 data-i="vh"></h2>
                </div>
                <div class="grid g3">
                    <div class="card vc">
                        <!-- <div class="ic">🌟</div> -->
                        <h3 data-i="v1"></h3>
                        <p data-i="vd1"></p>
                    </div>
                    <div class="card vc">
                        <!-- <div class="ic">🦁</div> -->
                        <h3 data-i="v2"></h3>
                        <p data-i="vd2"></p>
                    </div>
                    <div class="card vc">
                        <!-- <div class="ic">🤲</div> -->
                        <h3 data-i="v3"></h3>
                        <p data-i="vd3"></p>
                    </div>
                </div>
            </div>
        </section>

        <section id="domains">
            <div class="wrap">
                <div class="head">
                    <span class="tag" data-i="t2"></span>
                    <h2 data-i="d0"></h2>
                </div>
                <div class="grid g3">
                    <div class="card">
                        <!-- <div class="ic">📚</div> -->
                        <h3 data-i="d1"></h3>
                        <p data-i="d1p"></p>
                    </div>
                    <div class="card">
                        <!-- <div class="ic">🩺</div> -->
                        <h3 data-i="d2"></h3>
                        <p data-i="d2p"></p>
                    </div>
                    <div class="card">
                        <!-- <div class="ic">🛡️</div> -->
                        <h3 data-i="d3"></h3>
                        <p data-i="d3p"></p>
                    </div>
                    <div class="card">
                        <!-- <div class="ic">💙</div> -->
                        <h3 data-i="d4"></h3>
                        <p data-i="d4p"></p>
                    </div>
                    <div class="card">
                        <!-- <div class="ic">🌱</div> -->
                        <h3 data-i="d5"></h3>
                        <p data-i="d5p"></p>
                    </div>
                </div>
            </div>
        </section>

        <section id="impact" class="alt">
            <div class="wrap">
                <div class="head">
                    <span class="tag" data-i="t3"></span>
                    <h2 data-i="k0"></h2>
                </div>
                <div class="grid g5">
                    <div class="num">
                        <!-- <div class="ic">👧</div> -->
                        <b data-c="50">0</b>
                        <p data-i="s1"></p>
                    </div>
                    <div class="num">
                        <!-- <div class="ic">🏠</div> -->
                        <b data-c="2">0</b>
                        <p data-i="s2"></p>
                    </div>
                    <div class="num">
                        <!-- <div class="ic">🤝</div> -->
                        <b data-c="20">0</b>
                        <p data-i="s3"></p>
                    </div>
                    <div class="num">
                        <!-- <div class="ic">📋</div> -->
                        <b data-c="10">0</b>
                        <p data-i="s4"></p>
                    </div>
                    <div class="num">
                        <!-- <div class="ic">💰</div> -->
                        <b data-c="500000" data-cur="1">0</b>
                        <p data-i="s5"></p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="wrap">
                <div class="head">
                    <!-- <span class="tag" data-i="t4"></span> -->
                    <h2 data-i="r0"></h2>
                </div>
                <div class="grid gal">
                    <div class="gi">
                        <!-- <div class="ph">📚</div> -->
                        <div>
                            <!-- <small data-i="r1d"></small> -->
                            <p data-i="r1"></p>
                        </div>
                    </div>
                    <div class="gi">
                        <!-- <div class="ph">🍲</div> -->
                        <div>
                            <!-- <small data-i="r2d"></small> -->
                            <p data-i="r2"></p>
                        </div>
