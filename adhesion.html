const clean=x=>String(x).replace(/[’‘]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,"-").replace(/[·•]/g,"-").replace(/…/g,"...");
function collect(){const T=D[L],out=[];
SECS.forEach(([id,fl])=>{const rows=[];
fl.forEach(([n,t,k,r,o])=>{let v;
if(t=="radio"){const c=form.querySelector(`[name=${n}]:checked`);v=c?T[c.value]:""}
else if(t=="check"){v=[...form.querySelectorAll(`[name=${n}]:checked`)].map(c=>T[c.value]).join(", ")}
else if(t=="select"){const e=form.elements[n];v=e.value?T[e.value]:""}
else v=form.elements[n].value.trim();
rows.push([T[k],v||T.none])});
out.push([T[LEG[id]],rows])});return out}

function makePDF(){const {jsPDF}=window.jspdf,T=D[L],doc=new jsPDF({unit:"mm",format:"a4"});
const W=210,M=18;let y=0;
const head=()=>{doc.setFillColor(5,11,31);doc.rect(0,0,W,34,"F");doc.setFillColor(242,182,50);doc.rect(0,34,W,1.4,"F");
doc.setTextColor(242,182,50);doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text("LES AILES DE L'ESPOIR",M,15);
doc.setTextColor(255,255,255);doc.setFontSize(10);doc.setFont("helvetica","normal");doc.text(clean(T.pdft)+"  |  ESPOIR - COURAGE - SOLIDARITE",M,23);doc.text(clean(T.pdfd)+" : "+new Date().toLocaleDateString(L=="fr"?"fr-FR":"en-GB"),M,29);y=46};
head();
collect().forEach(([title,rows])=>{
if(y>262){doc.addPage();head()}
doc.setFillColor(11,23,54);doc.rect(M,y-5,W-2*M,8,"F");doc.setTextColor(242,182,50);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(clean(title).toUpperCase(),M+3,y+.5);y+=10;
rows.forEach(([l,v])=>{const lines=doc.splitTextToSize(clean(v),W-2*M-62),ll=doc.splitTextToSize(clean(l),56);const hgt=Math.max(lines.length,ll.length)*5+2;
if(y+hgt>280){doc.addPage();head()}
doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(120,90,10);doc.text(ll,M,y);
doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(25,30,50);doc.text(lines,M+60,y);y+=hgt;
doc.setDrawColor(225,225,235);doc.line(M,y-3,W-M,y-3)});y+=5});
const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130);doc.text("Les Ailes de l'Espoir - "+MAIL+" - "+i+"/"+n,W/2,291,{align:"center"})}
return doc.output("blob")}
